<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leyenda de la F1 - Pro Edition</title>
    <!-- Importamos una fuente moderna de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --panel-bg: #151518;
            --primary: #e10600; /* Rojo F1 Oficial */
            --primary-hover: #ff1a1a;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #2e86de; /* Color para reputación/talento */
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #2a0808 0%, #0a0a0c 50%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #game-container {
            max-width: 850px;
            width: 100%;
            background-color: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        /* Cabecera y Estadísticas */
        header {
            background-color: #000;
            border-bottom: 4px solid var(--primary);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-badge {
            background: #222;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 700;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-badge span { color: var(--accent); font-size: 1.2em; }
        .stat-badge .money { color: #4cd137; }

        /* Imagen del Evento */
        #image-container {
            width: 100%;
            height: 250px;
            background-color: #000;
            overflow: hidden;
            position: relative;
        }

        #event-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }

        /* Pantalla de Historia */
        #story-panel {
            padding: 30px;
            font-size: 1.1em;
            line-height: 1.8;
        }

        #event-title {
            color: var(--text-main);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        #event-description {
            color: var(--text-muted);
            margin-bottom: 0;
        }

        /* Botones de Decisión */
        #choices-panel {
            padding: 0 30px 30px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button.choice-btn {
            background: linear-gradient(90deg, #1e1e1e 0%, #252525 100%);
            color: var(--text-main);
            border: 1px solid #444;
            padding: 18px 25px;
            font-size: 1.05em;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button.choice-btn:hover {
            background: var(--primary);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(225, 6, 0, 0.4);
        }

        button.choice-btn span.icon {
            font-size: 1.2em;
        }

        /* Historial de logs */
        #log-panel {
            background-color: #0a0a0a;
            padding: 15px 30px;
            font-size: 0.85em;
            color: #666;
            height: 100px;
            overflow-y: auto;
            border-top: 1px solid #222;
        }

        #log-list { list-style: none; padding: 0; margin: 0; }
        #log-list li { margin-bottom: 8px; border-left: 3px solid #444; padding-left: 10px; }
        #log-list li.success { border-left-color: #4cd137; color: #a0f098; }
        #log-list li.danger { border-left-color: var(--primary); color: #ff9999; }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <div class="stat-badge">Cat: <span id="stat-category" style="color: #fff;">Fórmula 2</span></div>
        <div class="stat-badge">Talento: <span id="stat-talent">60</span></div>
        <div class="stat-badge">Reputación: <span id="stat-rep">45</span></div>
        <div class="stat-badge">Fondos: <span id="stat-money" class="money">500k$</span></div>
    </header>

    <!-- AQUÍ SE CARGARÁN LAS IMÁGENES -->
    <div id="image-container">
        <img id="event-image" src="" alt="Evento F1">
    </div>

    <div id="story-panel">
        <h2 id="event-title">Cargando...</h2>
        <p id="event-description">Calentando neumáticos...</p>
    </div>

    <div id="choices-panel"></div>

    <div id="log-panel">
        <ul id="log-list"></ul>
    </div>
</div>

<script>
    let state = {
        category: "Fórmula 2",
        talent: 60,
        money: 500000,
        reputation: 45
    };

    // BASE DE DATOS DE EVENTOS
    const eventsDB = {
        "start": {
            title: "Paddock de Monza",
            // INSTRUCCIÓN PARA TI: Cambia el enlace de abajo por la URL de un logo o foto que busques en internet.
            image: "https://images.unsplash.com/photo-1538561558231-1e967a5b3a44?q=80&w=1000&auto=format&fit=crop", 
            description: "Última carrera de la temporada de F2. Estás peleando por el campeonato. En el paddock, te cruzas con Helmut Marko, el temido asesor de Red Bull. Te mira fijamente. ¿Cómo reaccionas?",
            choices: [
                {
                    text: "Le sostengo la mirada con confianza y le asiento.",
                    action: () => {
                        updateStats(0, 0, 10);
                        addLog("A Helmut le gusta tu actitud desafiante. Ganas reputación.", "success");
                        return "monza_race";
                    }
                },
                {
                    text: "Bajo la mirada y me concentro en mis notas con los ingenieros.",
                    action: () => {
                        updateStats(5, 0, -5);
                        addLog("Ganas concentración para la carrera, pero la prensa dice que te falta carisma.");
                        return "monza_race";
                    }
                }
            ]
        },
        "monza_race": {
            title: "Safety Car a 3 Vueltas",
            image: "https://images.unsplash.com/photo-1614200187524-dc4b892acf16?q=80&w=1000&auto=format&fit=crop",
            description: "Bandera amarilla. Vas segundo, justo detrás de tu máximo rival por el título. Tu ingeniero te avisa por radio: 'Entramos a boxes a poner blandos nuevos o nos quedamos fuera con los duros desgastados para mantener posición en pista'.",
            choices: [
                {
                    text: "¡Box, box! Parar a por neumáticos blandos (Riesgo).",
                    action: () => {
                        let success = Math.random() > 0.4; // 60% de éxito
                        if(success) {
                            updateStats(10, 0, 20);
                            addLog("¡Jugada maestra! Vuelves a pista y te comes a tu rival en la última vuelta. ¡ERES CAMPEÓN DE F2!", "success");
                            return "f1_offers";
                        } else {
                            updateStats(0, 0, -10);
                            addLog("Parada lenta de los mecánicos. Te quedas atascado en el tráfico y pierdes el mundial.", "danger");
                            return "f1_offers_bad";
                        }
                    }
                },
                {
                    text: "Me quedo fuera. Yo defiendo esta posición con la vida (Defensivo).",
                    action: () => {
                        updateStats(5, 0, 5);
                        addLog("Agujereas tu coche para ser ancho. Tu rival no puede pasarte, pero desgastas tanto el coche que acabas exhausto. Eres campeón, pero por los pelos.");
                        return "f1_offers";
                    }
                }
            ]
        },
        "f1_offers": {
            title: "El Teléfono Suena",
            image: "https://images.unsplash.com/photo-1629824647363-23df2a7bc018?q=80&w=1000&auto=format&fit=crop",
            description: "Eres el chico de moda. Tienes dos contratos sobre la mesa para subir a la Fórmula 1. Tienes que elegir tu destino.",
            choices: [
                {
                    text: "Fichar por Williams (Menos presión, sueldo de 2M$).",
                    action: () => {
                        state.category = "Fórmula 1";
                        updateStats(0, 2000000, 5);
                        addLog("Bienvenido a Grove. Tu objetivo es devolver al equipo histórico a la zona media.", "success");
                        return "press_conference";
                    }
                },
                {
                    text: "Fichar por Ferrari (Máxima presión, sueldo de 10M$).",
                    condition: () => state.reputation >= 60, // Solo sale si tienes buena fama
                    action: () => {
                        state.category = "Fórmula 1";
                        updateStats(0, 10000000, 30);
                        addLog("Il Cavallino Rampante te ha elegido. Toda Italia te mira.", "success");
                        return "press_conference";
                    }
                }
            ]
        },
        "f1_offers_bad": {
            title: "Mercado Duro",
            image: "https://images.unsplash.com/photo-1541443131876-44b032227854?q=80&w=1000&auto=format&fit=crop",
            description: "Tras perder el mundial por aquel error estratégico, los equipos grandes te ignoran. Haas F1 Team te ofrece un asiento, pero debes traer patrocinadores.",
            choices: [
                {
                    text: "Pagar 500k$ de mis ahorros para correr con Haas.",
                    action: () => {
                        if(state.money >= 500000) {
                            state.category = "Fórmula 1";
                            updateStats(5, -500000, 10);
                            addLog("Has comprado tu asiento. Ahora toca demostrar que mereces estar aquí.", "success");
                            return "press_conference";
                        } else {
                            addLog("No tienes dinero suficiente. Te quedas sin asiento.", "danger");
                            return "game_over";
                        }
                    }
                }
            ]
        },
        "press_conference": {
            title: "Rueda de Prensa Oficial",
            image: "https://images.unsplash.com/photo-1588681664899-f142ff2dc9b1?q=80&w=1000&auto=format&fit=crop",
            description: "Es tu presentación ante los medios. Un periodista inglés del periódico 'The Sun' te lanza un dardo: 'Muchos dicen que tu llegada a la F1 es solo suerte y dinero. ¿Qué tienes que decir?'",
            choices: [
                {
                    text: "Contestar enfadado: 'Mis resultados hablan por mí, no escucho a la prensa británica'.",
                    action: () => {
                        updateStats(0, 0, -15);
                        addLog("Se hace un silencio tenso. Te ganas enemigos en la prensa el primer día.", "danger");
                        return "end_demo";
                    }
                },
                {
                    text: "Sonreír y decir: 'Lo demostraré el domingo en la pista'.",
                    action: () => {
                        updateStats(5, 0, 10);
                        addLog("Respuesta de libro. Los patrocinadores adoran tu actitud.", "success");
                        return "end_demo";
                    }
                }
            ]
        },
        "end_demo": {
            title: "Continuará...",
            image: "https://images.unsplash.com/photo-1534430480872-3498386e7856?q=80&w=1000&auto=format&fit=crop",
            description: "¡Aquí comienza tu verdadera historia en la F1! A partir de aquí puedes expandir el código con las carreras, incidentes con compañeros (ej: 'Tu compañero te cierra en la recta') y mejoras al coche.",
            choices: [
                {
                    text: "Reiniciar Simulador",
                    action: () => {
                        location.reload(); 
                        return "start";
                    }
                }
            ]
        }
    };

    // FUNCIONES
    function updateStats(talent, money, reputation) {
        state.talent += talent;
        state.money += money;
        state.reputation += reputation;
    }

    function formatMoney(num) {
        if(num >= 1000000) return (num / 1000000).toFixed(1) + "M$";
        if(num >= 1000) return (num / 1000).toFixed(0) + "k$";
        return num + "$";
    }

    function addLog(message, type = "normal") {
        const logList = document.getElementById('log-list');
        const newLog = document.createElement('li');
        if(type !== "normal") newLog.className = type;
        
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        newLog.innerHTML = `[${time}] ${message}`;
        logList.insertBefore(newLog, logList.firstChild);
    }

    function renderEvent(eventId) {
        const event = eventsDB[eventId];
        
        // Stats
        document.getElementById('stat-category').innerText = state.category;
        document.getElementById('stat-talent').innerText = state.talent;
        document.getElementById('stat-money').innerText = formatMoney(state.money);
        document.getElementById('stat-rep').innerText = state.reputation;

        // Visuales y Narrativa
        const imgEl = document.getElementById('event-image');
        if(event.image) {
            imgEl.src = event.image;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
        }

        document.getElementById('event-title').innerText = event.title;
        document.getElementById('event-description').innerText = event.description;

        // Botones
        const choicesPanel = document.getElementById('choices-panel');
        choicesPanel.innerHTML = ''; 

        event.choices.forEach(choice => {
            if (choice.condition && !choice.condition()) return;

            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerHTML = `<span>${choice.text}</span> <span class="icon">🏁</span>`;
            
            btn.onclick = () => {
                const nextEventId = choice.action();
                if(nextEventId) renderEvent(nextEventId);
            };
            choicesPanel.appendChild(btn);
        });
    }

    // INICIAR JUEGO
    addLog("Motor encendido. Suerte.");
    renderEvent("start");

</script>
</body>
</html>
